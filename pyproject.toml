[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planpath"
version = "1.0.0"
description = "PlanPath patient-level pathology VQA agent framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "h5py>=3.10",
  "requests>=2.31",
  "pydantic>=2.7",
  "torch>=2.4.1",
  "transformers>=4.46,<6",
  "safetensors>=0.4",
  "einops>=0.6.1",
  "huggingface-hub>=0.33.4",
  "openslide-python>=1.3.1",
  "openslide-bin>=4.0.0.8; platform_system == 'Linux'",
]

[project.optional-dependencies]
histoplus = [
  "timm==1.0.8",
  "scikit-image>=0.24.0",
  "scipy>=1.10",
  "opencv-python-headless>=4.10.0.84",
  "pandas>=1.5",
  "shapely>=2.1.0",
  "joblib>=1.4.2",
  "tqdm>=4.66.5",
  "loguru>=0.7.2",
  "typer>=0.12",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["planpath*"]
